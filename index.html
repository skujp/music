<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exploring BASS : a musical language to learn chords, rythms, and compositions">
    <meta http-equiv="Cache-Control" content="must-revalidate, max-age=43200">
    <link rel="icon" href="./favicon.ico">
    <title>BASS | learns | to | chord |</title>
    <style>.oops-container{position:fixed;top:20px;right:20px;z-index:9999}.oops{padding:12px 20px;margin-bottom:10px;border-radius:4px;color:#fff;font-weight:500;opacity:0;transition:opacity .3s ease}.oops-show{opacity:1}.oops-success{background-color:#1e7e34}.oops-info{background-color:#0c3658}.oops-warning{background-color:#b17214}.oops-error{background-color:#9c809c}</style>
    <script src="bass.js" defer></script>
    <script src="event.js" defer></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body,button,input,textarea{font-family:Arial,sans-serif}
        body{background:#f4f4f9;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px;min-height:100vh}
        .container{width:100%;max-width:100%;background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,.1);display:flex;flex-direction:column}
        h2,h3{text-align:center;color:#333;margin-bottom:15px}
        .sheet-area{width:100%;height:120px;padding:10px;border:2px solid #ccc;border-radius:4px;resize:none;font-family:monospace;font-size:16px;margin-bottom:15px}
        .controls{display:flex;gap:10px;margin-bottom:25px}
        .control-btn{flex:1 1 0;min-width:0;padding:10px;background:#1e7e34;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:700;text-align:center;white-space:nowrap}
        .control-btn:hover{background:#218838}
        .piano-container{position:relative;display:flex;height:180px;background:#000;padding:3px;border-radius:4px;margin-bottom:25px;user-select:none;width:100%}
        .piano-container,.white-key,.black-key,.string,.fret,.control-btn,button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
        .white-key-wrapper{position:relative;flex:1;display:flex}
        .white-key{width:100%;height:100%;background:#fff;border:1px solid #ccc;border-bottom-left-radius:4px;border-bottom-right-radius:4px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:14px;font-weight:700;color:#555}
        .white-key:active,.white-key.active,.string:active,.string.active{background:#e0e0e0}
        .black-key{width:60%;height:60%;background:#000;position:absolute;z-index:2;cursor:pointer;border-bottom-left-radius:3px;border-bottom-right-radius:3px;right:-30%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11px;font-weight:700;color:#fff}
        .black-key:active,.black-key.active,.fret:active,.fret.active{background:#333}
        .database-section{border:1px solid #ddd;border-radius:4px;padding:15px;background:#fafafa}
        .database-section h3{margin-bottom:10px;color:#555;font-size:14px;text-transform:uppercase}
        .song-search{width:100%;padding:8px 10px;margin-bottom:10px;border:1px solid #ccc;border-radius:4px}
        .song-list{list-style:none}
        .song-item{padding:8px;border-bottom:1px solid #eee;cursor:default;display:flex;align-items:center;gap:8px;font-size:14px}
        .song-item:last-child{border-bottom:none}
        .song-item:hover{background:#f0f0f0}
        .song-title-link{color:#0056b3;text-decoration:underline;cursor:pointer;font-weight:700;flex:1}
        .song-title-link:hover{color:#0056b3}
        .song-meta{color:#666;margin-left:auto;white-space:nowrap}
        .song-link{margin-left:4px;color:#007bff;text-decoration:none;font-size:14px;font-weight:700;white-space:nowrap}
        .song-link:hover{color:#0056b3}
        .song-item.pagination-info{justify-content:center;color:#6d6d6d;font-style:italic;cursor:default}
        .pagination-controls{display:flex;justify-content:space-between;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid #eee}
        .pagination-btn{padding:6px 10px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer}
        .pagination-btn:disabled{cursor:not-allowed;opacity:.5}
        @media screen and (min-width:768px) and (max-width:1024px),screen and (min-width:1025px) and (max-width:1368px) and (orientation:portrait){body{padding:40px 20px}.container{max-width:92%;padding:35px}h1{font-size:32px;margin-bottom:25px}.sheet-area{height:220px;font-size:20px;margin-bottom:25px}.controls{gap:15px;margin-bottom:35px}.control-btn{padding:15px;font-size:18px}.piano-container{height:240px;margin-bottom:35px}.guitar-container{height:240px!important}.database-section{padding:25px}.database-section h3{font-size:18px}.song-item{padding:15px 10px;font-size:18px}}
        @media screen and (min-width:1025px) and (orientation:landscape){body{padding:50px 20px;justify-content:center}.container{max-width:650px;padding:25px;box-shadow:0 10px 25px rgba(0,0,0,.15)}.sheet-area{height:140px}.piano-container{height:170px}}
        .piano-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:5px}
        .piano-btn{width:24px;height:20px;border-radius:6px;border:1px solid #ccc;background:#fff;font-size:20px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.06)}
        .piano-btn:hover{background:#f0f0f2}
        .guitar-container{border-left:3px solid #1c65a1;border-right:3px solid #1c65a1;position:relative;display:none;align-items:center;height:170px;background:transparent;margin-bottom:25px;user-select:none;width:100%;overflow:hidden}
        .guitar{display:flex;align-items:center;width:100%;height:100%;position:relative}
        .neck-system{display:flex;align-items:center;flex:1;position:relative;height:100%}
        .neck{flex:1;height:80%;position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center}
        .fret{width:1px;height:128%;background-color:#b2bec3;opacity:.5}
        .strings-overlay{color:#0056b3;position:absolute;left:0;right:0;height:83%;display:flex;flex-direction:column;justify-content:space-between;z-index:6}
        .string{width:100%;background:linear-gradient(to bottom,#fff,#b2bec3);box-shadow:0 1px 1px rgba(0,0,0,.3)}
        .string-1,.string-2,.string-3,.string-4,.string-5,.string-6{height:11px}
        .emoticon-font{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",Arial,sans-serif}
        .piano-btn-override{width:100%;height:unset;margin-bottom:15px}
    </style>
</head>
<body>

    <main class="container">

        <h2>| BASS |</h2>
        <h3>is the musical language</h3>

        <textarea class="sheet-area" 
                placeholder="| Use the BASS notation system to compose your music here |" 
                id="sheetMusic">
        </textarea>

        <div class="controls">
            <button class="control-btn" id="playBtn">Play</button>
            <button class="control-btn" id="stopBtn">Stop</button>
            <button class="control-btn" id="readBtn">Read</button>
        </div>

        <div class="piano-container" id="piano">
            <div class="white-key-wrapper">
                <div class="white-key" id="cNote">C</div>
                <div class="black-key" id="cSNote"></div>
            </div>

            <div class="white-key-wrapper">
                <div class="white-key" id="dNote">D</div>
                <div class="black-key" id="dSNote"></div>
            </div>

            <div class="white-key-wrapper">
                <div class="white-key" id="eNote">E</div>
            </div>

            <div class="white-key-wrapper">
                <div class="white-key" id="fNote">F</div>
                <div class="black-key" id="fSNote"></div>
            </div>

            <div class="white-key-wrapper">
                <div class="white-key" id="gNote">G</div>
                <div class="black-key" id="gSNote"></div>
            </div>

            <div class="white-key-wrapper">
                <div class="white-key" id="aNote">A</div>
                <div class="black-key" id="aSNote"></div>
            </div>

            <div class="white-key-wrapper">
                <div class="white-key" id="bNote">B</div>
            </div>

            <div class="white-key-wrapper">
                <div class="white-key" id="cNote1">C</div>
                <div class="black-key" id="cSNote1"></div>
            </div>

            <div class="white-key-wrapper">
                <div class="white-key" id="dNote1">D</div>
                <div class="black-key" id="dSNote1"></div>
            </div>

            <div class="white-key-wrapper">
                <div class="white-key" id="eNote1">E</div>
            </div>

            <div class="white-key-wrapper">
                <div class="white-key" id="fNote1">F</div>
                <div class="black-key" id="fSNote1"></div>
            </div>

            <div class="white-key-wrapper">
                <div class="white-key" id="gNote1">G</div>
            </div>
        </div>
        
        <div class="guitar-container" id="acoustic">
            <div class="guitar">
                <div class="neck-system">
                    <div class="neck">
                        <div class="fret"></div>
                        <div class="fret" id="f1">1</div>
                        <div class="fret" id="f2">2</div>
                        <div class="fret" id="f3">3</div>
                        <div class="fret" id="f4">4</div>
                        <div class="fret" id="f5">5</div>
                        <div class="fret"></div>
                    </div>

                    <div class="strings-overlay">
                        <div class="string string-6" id="s6">E</div> <!-- lower E -->
                        <div class="string string-5" id="s5">A</div> <!-- A -->
                        <div class="string string-4" id="s4">D</div> <!-- D -->
                        <div class="string string-3" id="s3">G</div> <!-- G -->
                        <div class="string string-2" id="s2">B</div> <!-- B -->
                        <div class="string string-1" id="s1">E</div> <!-- higher E -->
                    </div>
                </div>
            </div>
        </div>

        <div class="piano-controls emoticon-font">
            <button class="piano-btn piano-btn-override" id="minusBtn" aria-label="Multipurpose Minus Button">➖</button>
            <button class="piano-btn piano-btn-override" id="rotateBtn" aria-label="Rotate Musical Instrument Button">🎹</button>
            <button class="piano-btn piano-btn-override" id="plusBtn"  aria-label="Multipurpose Plus Button">➕</button>
        </div>

        <div class="database-section" id="bassboard">
            <h3>BASSBOARD TOP 100</h3>
            <input type="text" class="song-search" placeholder="Search sheet music or contributors" aria-label="Search sheet music or contributors" name="song-search"/>
            <ul class="song-list" id="songList">
                <li class="song-item">
                </li>
            </ul>
        </div> 
    </main>
</body>
</html>
